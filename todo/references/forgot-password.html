<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Lupa Password - Tampaksiring Smart Cluster</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link

    <link

    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'tertiary-container': '#bb5808',
              'on-primary': '#ffffff',
              'on-surface-variant': '#4e453c',
              'surface-container-highest': '#ffdad4',

              'surface-container-low': '#fff0ee',
              'tertiary-fixed-dim': '#ffb68d',
              'error-container': '#ffdad6',
              'on-secondary-container': '#626361',
              'on-secondary-fixed': '#1a1c1a',
              'on-primary-fixed': '#291801',
              'on-tertiary-fixed': '#321200',
              'primary-fixed': '#ffddb6',
              'inverse-primary': '#e2c19b',
              'primary-fixed-dim': '#e2c19b',
              'surface-container': '#ffe9e5',
              'on-primary-container': '#fffbff',
              surface: '#fff8f6',
              'on-tertiary-container': '#fffbff',
              'on-surface': '#2b1613',
              'primary-container': '#8b704f',
              'surface-variant': '#ffdad4',
              'inverse-surface': '#422a26',
              'secondary-fixed-dim': '#c7c6c4',
              'on-tertiary-fixed-variant': '#763400',
              error: '#ba1a1a',
              'surface-container-high': '#ffe2dd',
              'surface-bright': '#fff8f6',
              'on-secondary': '#ffffff',
              'secondary-container': '#e0e0dd',
              'outline-variant': '#d1c4b8',
              'surface-container-lowest': '#ffffff',
              background: '#fff8f6',
              primary: '#705838',
              'surface-dim': '#f8d1cb',
              'on-primary-fixed-variant': '#594325',
              'on-error-container': '#93000a',
              'surface-tint': '#735a3a',
              'on-secondary-fixed-variant': '#464745',
              'tertiary-fixed': '#ffdbc9',
              'secondary-fixed': '#e3e2e0',
              outline: '#80756b',
              'on-error': '#ffffff',
              'on-background': '#2b1613',
              'on-tertiary': '#ffffff',
              'inverse-on-surface': '#ffedea',
              tertiary: '#974400',
            },
            borderRadius: {
              DEFAULT: '0.25rem',
              lg: '0.5rem',
              xl: '0.75rem',
              full: '9999px',
            },
            spacing: {
              base: '8px',
              lg: '48px',
              sm: '12px',
              'max-width-desktop': '1280px',
              xl: '80px',
              md: '24px',
              gutter: '24px',
              'margin-mobile': '16px',
              xs: '4px',
            },
            fontFamily: {
              'body-lg': ['Inter'],
              'label-md': ['Inter'],
              'headline-lg': ['Inter'],
              'headline-lg-mobile': ['Inter'],
              'body-md': ['Inter'],
              'label-sm': ['Inter'],
              'title-md': ['Inter'],
              'display-lg': ['Inter'],
            },
            fontSize: {

              'label-md': [
                '14px',
                { lineHeight: '20px', letterSpacing: '0.01em', fontWeight: '500' },
              ],
              'headline-lg': [
                '32px',
                { lineHeight: '40px', letterSpacing: '-0.01em', fontWeight: '600' },
              ],
              'headline-lg-mobile': ['28px', { lineHeight: '36px', fontWeight: '600' }],
              'body-md': ['16px', { lineHeight: '24px', fontWeight: '400' }],
              'label-sm': ['12px', { lineHeight: '16px', fontWeight: '600' }],
              'title-md': ['20px', { lineHeight: '28px', fontWeight: '600' }],
              'display-lg': [
                '48px',
                { lineHeight: '56px', letterSpacing: '-0.02em', fontWeight: '700' },
              ],
            },
          },
        },

    <style>
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
      body {
        background-color: #fff8f6;
        background-image: radial-gradient(circle at 2px 2px, #e0dcd0 1px, transparent 0);
        background-size: 40px 40px;
      }
    </style>
  </head>
  <body
    class="font-body-md text-on-background min-h-screen flex items-center justify-center p-margin-mobile"
  >
    <!-- Suppressed Shell Components as per "The Destination Rule": This is a linear transactional/auth page -->
    <main class="w-full max-w-md animate-in fade-in slide-in-from-bottom-4 duration-700">
      <!-- Logo Section -->
      <div class="flex flex-col items-center mb-lg">
        <img
          alt="Tampaksiring Logo"
          class="w-24 h-24 object-contain mb-4"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuA9bLE3LuZGiI6zNI4wLeL4qMJVtfvGl-wKYgYygPcPTdmJz93ojiAamcVUeLFd81AF_cxku2yQ4UJZDtY9-GqSf_ylfVjvhY4IGdoAFpKHg2EcXzziMJ8NwwxhianBuJadunAZb1DNQlDIfDVWH9AFjOW_fVyXuoIWUT-uD77vKZMhDCr4lKZqhgL-tV8M3KoyTp86GHp9weJWUSmN3UrQHq7i1pHmOe2OSmmPcKNJ0Ljq60YI4IRX7cnZccu5Rjzin4gU4_zFvu4"
        />
        <h1
          class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary text-center"
        >
          Lupa Password
        </h1>
        <p class="font-body-md text-body-md text-on-surface-variant text-center mt-2 px-4">
          Masukkan nomor rumah Anda untuk menerima instruksi pemulihan kata sandi.
        </p>
      </div>
      <!-- Reset Password Form Card -->
      <div
        class="bg-surface rounded-xl shadow-[0px_4px_20px_rgba(62,39,35,0.05)] border border-outline-variant p-md md:p-lg relative overflow-hidden"
      >
        <!-- Subtle Decorative Element -->
        <div
          class="absolute top-0 right-0 w-32 h-32 bg-primary-fixed opacity-10 rounded-full -mr-16 -mt-16"
        ></div>
        <form action="#" class="space-y-6 relative z-10" method="POST">
          <!-- No. Rumah Input -->
          <div class="space-y-2">
            <label class="block font-label-md text-label-md text-on-surface" for="house_number"
              >No. Rumah</label
            >
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline"
                >home</span
              >
              <input
                class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline/50 font-body-md text-body-md"
                id="house_number"
                name="house_number"
                placeholder="Contoh: Blok A-12"
                type="text"
              />
            </div>
          </div>
          <!-- Captcha Section -->
          <div class="space-y-2">
            <label class="block font-label-md text-label-md text-on-surface" for="captcha"
              >Verifikasi Keamanan</label
            >
            <div class="flex gap-3">
              <div
                class="flex-1 bg-surface-container-high rounded-lg flex items-center justify-center border border-dashed border-outline select-none py-3 overflow-hidden"
              >
                <span class="italic font-bold tracking-[0.5em] text-primary opacity-60"
                  >X R 7 9 W</span
                >
              </div>
              <button
                class="p-3 bg-secondary-container text-on-secondary-container rounded-lg hover:bg-outline-variant transition-colors active:scale-95"
                type="button"
              >
                <span class="material-symbols-outlined block">refresh</span>
              </button>
            </div>
            <input
              class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline/50 font-body-md text-body-md"
              id="captcha"
              name="captcha"
              placeholder="Masukkan kode di atas"
              type="text"
            />
          </div>
          <!-- Submit Button -->
          <button
            class="w-full bg-primary text-on-primary py-4 rounded-lg font-label-md text-label-md shadow-md hover:bg-primary-container active:scale-[0.98] transition-all duration-200 uppercase tracking-wider"
            type="submit"
          >
            Kirim Permintaan
          </button>
        </form>
      </div>
      <!-- Navigation Links -->
      <div class="mt-lg text-center space-y-4">
        <a
          class="inline-flex items-center gap-2 font-label-md text-label-md text-primary hover:text-tertiary transition-colors group"
          href="/login"
        >
          <span
            class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform"
            >arrow_back</span
          >
          Kembali ke Login
        </a>
        <div class="pt-base border-t border-outline-variant/30">
          <p class="font-label-sm text-label-sm text-on-surface-variant">
            Butuh bantuan teknis?
            <a class="text-primary font-bold hover:underline" href="#">Hubungi Pengurus</a>
          </p>
        </div>
      </div>
    </main>
    <!-- Background Decoration -->
    <div class="fixed bottom-0 right-0 p-8 opacity-10 pointer-events-none hidden lg:block">
      <span
        class="material-symbols-outlined text-[240px]"
        style="
          font-variation-settings:
            'FILL' 0,
            'wght' 100;
        "
        >domain</span
      >
    </div>
    <script>
      // Simple micro-interaction for the submit button
      const form = document.querySelector('form');
      const submitBtn = form.querySelector('button[type="submit"]');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const originalText = submitBtn.innerText;
        submitBtn.disabled = true;
        submitBtn.innerHTML =
          '<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Memproses...</span>';

        setTimeout(() => {
          alert(
            'Permintaan telah dikirim. Jika nomor rumah terdaftar, Anda akan menerima instruksi selanjutnya melalui email atau WhatsApp.',
          );
          submitBtn.disabled = false;
          submitBtn.innerText = originalText;
        }, 1500);
      });
    </script>
  </body>
</html>
