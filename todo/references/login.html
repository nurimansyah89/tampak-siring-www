    <style>
      body {
        background-color: #faf9f6;
        font-family: 'Inter', sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
    </style>

  <body
    class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-gutter"
  >
    <!-- Login Container -->
    <main class="w-full max-w-[440px] animate-fade-in">
      <!-- Logo Area -->
      <div class="flex flex-col items-center mb-xl">
        <img
          alt="Tampaksiring Logo"
          class="w-24 h-24 mb-sm object-contain"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxVYK252Tr4rM3Wuox493SB0WvnWpM5q7b9_eWxWaec-ou6-HMqJ4wlEUT2WllzonMdjV1_edSQ1MmEqn_Rd1d1yy1OfLkfvoRBbLXSdK0_bXFmzP2mkVIvXBEwzd1R3slVT_58hdkYiDxkNxcqbyBQsZgzG21dnz1Iu0vEZFUEmHBKeJrS3lsLXgbmMyPnQVzIETcsUQ-nx9qzOLkHGbcWi3gg2UPS7O8E1vEzdacr--RfNYVQw576asc3N8bW-yIdZHjlocl52E"
        />
        <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary text-center">
          Tampaksiring
        </h1>
        <p class="font-label-md text-label-md text-on-surface-variant text-center opacity-80">
          Smart Cluster Portal
        </p>
      </div>
      <!-- Login Card -->
      <div
        class="bg-surface-container-lowest rounded-xl shadow-level-1 p-md md:p-lg border border-outline-variant/30"
      >
        <h2 class="font-title-md text-title-md text-on-surface mb-base">Masuk</h2>
        <p class="font-body-md text-body-md text-on-surface-variant mb-xl">
          Silakan masukkan detail akun Anda untuk mengakses layanan warga.
        </p>
        <form class="space-y-md">
          <!-- House Number Input -->
          <div class="space-y-xs">
            <label class="font-label-md text-label-md text-on-surface-variant block" for="house_no"
              >No. Rumah</label
            >
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline"
                >home</span
              >
              <input
                class="w-full pl-12 pr-4 py-3 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md text-on-surface outline-none"
                id="house_no"
                placeholder="&lt;BLOK-NO&gt;, e.g., Y06-12"
                type="text"
              />
            </div>
          </div>
          <!-- Password Input -->
          <div class="space-y-xs">
            <div class="flex justify-between items-center">
              <label
                class="font-label-md text-label-md text-on-surface-variant block"
                for="password"
                >Password</label
              >
              <a
                class="font-label-sm text-label-sm text-primary hover:underline transition-all"
                href="#"
                >Lupa Password?</a
              >
            </div>
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline"
                >lock</span
              >
              <input
                class="w-full pl-12 pr-12 py-3 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md text-on-surface outline-none"
                id="password"
                placeholder="••••••••"
                type="password"
              />
              <button
                class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors"
                type="button"
              >
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>
          </div>
          <!-- Captcha Placeholder -->
          <div
            class="bg-surface border border-outline-variant rounded-lg p-sm flex items-center justify-between"
          >
            <div class="flex items-center gap-sm">
              <div
                class="w-6 h-6 border-2 border-outline-variant rounded flex items-center justify-center bg-white cursor-pointer hover:border-primary transition-all"
                id="captcha-check"
              >
                <span
                  class="material-symbols-outlined text-primary text-body-md hidden"
                  id="check-icon"
                  >check</span
                >
              </div>
              <span class="font-label-md text-label-md text-on-surface-variant"
                >Saya bukan robot</span
              >
            </div>
            <div class="flex flex-col items-center">
              <span class="material-symbols-outlined text-secondary text-headline-lg"
                >security</span
              >
              <span class="text-[8px] uppercase tracking-widest text-outline">reCAPTCHA</span>
            </div>
          </div>
          <!-- Submit Button -->
          <button
            class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-lg shadow-md hover:bg-surface-tint active:scale-[0.98] transition-all duration-200"
            type="submit"
          >
            Login
          </button>
        </form>
        <div class="mt-xl pt-md border-t border-outline-variant/30 flex justify-center">
          <p class="font-label-sm text-label-sm text-on-surface-variant">
            Belum memiliki akses?
            <a class="text-primary font-bold hover:underline" href="#">Hubungi Pengurus</a>
          </p>
        </div>

      <!-- Footer Info -->

        <p class="font-label-sm text-label-sm text-outline">
          © 2024 Tampaksiring Smart Cluster. All rights reserved.
        </p>
        <div class="flex justify-center gap-md mt-sm">

            class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors"
            href="#"
            >Kebijakan Privasi</a
          >
          <a
            class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors"
            href="#"
            >Bantuan</a
          >
        </div>
      </footer>
    </main>
    <script>
      // Simple Interaction for Captcha simulation
      const captchaBox = document.getElementById('captcha-check');
      const checkIcon = document.getElementById('check-icon');

      captchaBox.addEventListener('click', () => {
        checkIcon.classList.toggle('hidden');
        captchaBox.classList.toggle('border-primary');
      });

      // Form Submission Simulation
      document.querySelector('form').addEventListener('submit', (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerText;
        btn.innerText = 'Memproses...';
        btn.disabled = true;
        btn.classList.add('opacity-70', 'cursor-not-allowed');

        setTimeout(() => {
          btn.innerText = originalText;
          btn.disabled = false;
          btn.classList.remove('opacity-70', 'cursor-not-allowed');
          alert('Fungsi login ini hanya simulasi UI.');
        }, 1500);
      });
    </script>
