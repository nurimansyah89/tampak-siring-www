<div class="relative pl-6 border-l-2 border-outline-variant space-y-8">
  @for (event of events(); track $index) {
    <div class="relative">
      <div
        class="absolute -left-[31px] top-0 w-4 h-4 rounded-full border-4 border-white shadow-sm"
        [class.bg-tertiary.animate-pulse]="event.isActive"
        [class.bg-primary]="!event.isActive && !$last"
        [class.bg-outline-variant]="!event.isActive && $last"
      ></div>
      <p class="font-label-sm text-label-sm text-on-surface-variant mb-1">{{ event.date }}</p>
      <p
        class="font-label-md text-label-md font-bold"
        [class.text-primary]="event.isActive"
        [class.text-on-surface]="!event.isActive"
      >
        {{ event.title }}
      </p>
      <p class="font-body-md text-body-md text-on-surface-variant mt-1">{{ event.description }}</p>
    </div>
  }
</div>
