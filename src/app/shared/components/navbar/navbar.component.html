<header class="fixed top-0 w-full z-50 bg-surface shadow-level-2 border-b border-outline-variant/20">
  <nav class="flex justify-between items-center px-margin-mobile md:px-gutter h-16 w-full">
    <a class="flex items-center gap-3" href="/">
      <img alt="Tampaksiring Logo" class="h-10 w-10 object-contain" src="/logo.png" />
      <span class="font-body-md text-body-md md:font-title-md md:text-title-md font-bold text-primary truncate max-w-[180px] md:max-w-none">
        Tampak Siring - Smart Cluster
      </span>
    </a>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-3 pl-3 border-l border-outline-variant relative">
        <button
          class="flex items-center gap-3 cursor-pointer"
          (click)="toggleDropdown()"
          type="button"
        >
          <div class="text-right hidden sm:block">
            <p class="font-label-md text-label-md text-on-surface font-bold">Andi Wijaya</p>
            <p class="font-label-sm text-label-sm text-on-surface-variant">Blok A-12</p>
          </div>
          <div
            class="h-10 w-10 rounded-full bg-primary-fixed flex items-center justify-center overflow-hidden border-2 border-primary-container"
          >
            <span class="material-symbols-outlined text-primary">account_circle</span>
          </div>
        </button>
        @if (dropdownOpen) {
          <div
            class="absolute top-full right-0 mt-2 w-48 bg-surface border border-outline-variant rounded-md shadow-level-2 py-2 z-50 overflow-hidden"
          >
            <a
              class="flex items-center gap-3 px-4 py-2.5 text-on-surface hover:bg-surface-container-high transition-colors font-body-md text-body-md"
              href="#"
            >
              <span class="material-symbols-outlined text-on-surface-variant">person</span>
              Akun Saya
            </a>
            <a
              class="flex items-center gap-3 px-4 py-2.5 text-on-surface hover:bg-surface-container-high transition-colors font-body-md text-body-md"
              routerLink="/me/finance"
            >
              <span class="material-symbols-outlined text-on-surface-variant">receipt_long</span>
              Iuran Saya
            </a>
            <a
              class="flex items-center gap-3 px-4 py-2.5 text-on-surface hover:bg-surface-container-high transition-colors font-body-md text-body-md"
              routerLink="/auth/authorize"
            >
              <span class="material-symbols-outlined text-on-surface-variant">logout</span>
              Logout
            </a>
          </div>
        }
      </div>
    </div>
  </nav>
</header>
