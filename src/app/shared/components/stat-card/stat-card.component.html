@if (variant() === 'filled') {
  <div
    class="h-full flex flex-col justify-center bg-primary-container shadow-level-1 rounded-card p-md"
  >
    <div class="flex justify-between items-start mb-4">
      <span
        class="material-symbols-outlined p-2 bg-white/20 rounded-lg {{ iconColor() }}"
      >{{ icon() }}</span>
      @if (badge()) {
        <span
          class="text-xs font-bold px-2 py-1 rounded-full {{ badgeClass() }}"
        >{{ badge() }}</span>
      }
    </div>
    <p class="font-label-md text-label-md text-on-primary-container/90">{{ label() }}</p>
    <h3 class="font-headline-lg text-headline-lg text-on-primary-container mt-1">{{ value() }}</h3>
    @if (additionalInfo()) {
      <p class="font-label-sm text-label-sm mt-2 text-on-primary-container/80">{{ additionalInfo() }}</p>
    }
  </div>
} @else {
  <div
    class="h-full flex flex-col justify-center bg-surface-container-lowest shadow-level-1 rounded-card p-md border-l-4 {{ accentBorder() }}"
  >
    <div class="flex justify-between items-start mb-4">
      <span
        class="material-symbols-outlined p-2 rounded-lg {{ iconBg() }} {{ iconColor() }}"
      >{{ icon() }}</span>
      @if (badge()) {
        <span
          class="text-xs font-bold px-2 py-1 rounded-full {{ badgeClass() }}"
        >{{ badge() }}</span>
      }
    </div>
    <p class="font-label-md text-label-md text-on-surface-variant">{{ label() }}</p>
    <h3 class="font-headline-lg text-headline-lg text-primary mt-1">{{ value() }}</h3>
    @if (additionalInfo()) {
      <p class="font-label-sm text-label-sm mt-2 text-on-surface-variant/80">{{ additionalInfo() }}</p>
    }
  </div>
}
