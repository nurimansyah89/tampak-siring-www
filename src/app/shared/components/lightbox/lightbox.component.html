<div
  class="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center"
  (click)="onBackdropClick()"
  role="dialog"
  aria-modal="true"
>
  <!-- Close button -->
  <button
    class="absolute top-4 right-4 w-12 h-12 flex items-center justify-center text-white/80 hover:text-white transition-colors z-10 cursor-pointer"
    (click)="onBackdropClick()"
    type="button"
    aria-label="Tutup"
  >
    <span class="material-symbols-outlined text-3xl">close</span>
  </button>

  <!-- Counter -->
  <div class="absolute top-4 left-4 text-white/80 font-label-md text-label-md z-10">
    {{ currentIndex() + 1 }} / {{ images().length }}
  </div>

  <!-- Previous -->
  @if (hasPrev) {
    <button
      class="absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 flex items-center justify-center text-white/80 hover:text-white transition-colors z-10 cursor-pointer"
      (click)="onPrev($event)"
      type="button"
      aria-label="Sebelumnya"
    >
      <span class="material-symbols-outlined text-4xl">chevron_left</span>
    </button>
  }

  <!-- Image -->
  <div class="max-w-[90vw] max-h-[90vh] flex items-center justify-center" (click)="onNext($event)">
    <img
      [src]="currentImage"
      class="max-w-full max-h-[90vh] object-contain rounded-lg select-none"
      alt="Foto bukti"
    />
  </div>

  <!-- Next -->
  @if (hasNext) {
    <button
      class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 flex items-center justify-center text-white/80 hover:text-white transition-colors z-10 cursor-pointer"
      (click)="onNext($event)"
      type="button"
      aria-label="Berikutnya"
    >
      <span class="material-symbols-outlined text-4xl">chevron_right</span>
    </button>
  }
</div>
