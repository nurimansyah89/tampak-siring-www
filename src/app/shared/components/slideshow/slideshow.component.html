<div
  class="relative w-full h-[300px] md:h-[450px] rounded-xl overflow-hidden shadow-lg group bg-black"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
>
  @for (slide of slides(); track $index) {
    <div class="slide" [class.active]="$index === currentIndex()">
      <img
        [alt]="slide.alt"
        class="w-full h-full object-cover transition-transform duration-700 hover:scale-105"
        [src]="slide.image"
      />
      <div class="absolute inset-0 w-full bg-gradient-to-t from-black/80 via-black/20 to-transparent flex flex-col justify-end p-6 md:p-12">
        <span
          class="inline-block px-3 py-1 text-white font-label-sm text-label-sm rounded-full w-fit mb-4"
          [class]="slide.badgeClass"
        >
          {{ slide.badge }}
        </span>
        <h1 class="w-full font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-white mb-2">
          {{ slide.title }}
        </h1>
        <p class="w-full font-body-md text-body-md text-white/90">
          {{ slide.description }}
        </p>
      </div>
    </div>
  }
  <button
    class="absolute left-4 top-1/2 -translate-y-1/2 z-20 flex items-center justify-center h-10 w-10 bg-black/30 hover:bg-black/50 text-white rounded-full transition-all opacity-0 group-hover:opacity-100 cursor-pointer"
    type="button"
    (click)="prevSlide()"
  >
    <span class="material-symbols-outlined">chevron_left</span>
  </button>
  <button
    class="absolute right-4 top-1/2 -translate-y-1/2 z-20 flex items-center justify-center h-10 w-10 bg-black/30 hover:bg-black/50 text-white rounded-full transition-all opacity-0 group-hover:opacity-100 cursor-pointer"
    type="button"
    (click)="nextSlide()"
  >
    <span class="material-symbols-outlined">chevron_right</span>
  </button>
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex gap-2">
    @for (slide of slides(); track $index) {
      <button
        class="dot w-2 h-2 rounded-full bg-white/40 transition-all cursor-pointer"
        [class.active]="$index === currentIndex()"
        (click)="goToSlide($index)"
        type="button"
      ></button>
    }
  </div>
</div>
