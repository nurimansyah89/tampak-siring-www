<div class="flex flex-col gap-xs">
  <div class="flex justify-between items-center">
    @if (label()) {
      <label
        class="font-label text-label-md text-on-surface-variant"
        [for]="id()"
      >{{ label() }}</label>
    }
    <ng-content select="[corner-text]" />
  </div>
  <div class="relative">
    @if (leftIcon()) {
      <span
        class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none"
      >{{ leftIcon() }}</span>
    }
    <input
      #inputEl
      [id]="id()"
      [type]="type()"
      [placeholder]="placeholder()"
      [value]="value()"
      [attr.disabled]="disabled() ? '' : null"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="w-full bg-surface border transition-all font-body text-body-md text-on-surface outline-none rounded py-3"
      [class.border-error]="!!error()"
      [class.border-outline-variant]="!error()"
      [class.focus:border-error]="!!error()"
      [class.focus:ring-error]="!!error()"
      [class.focus:border-primary]="!error()"
      [class.focus:ring-1]="!error()"
      [class.focus:ring-primary]="!error()"
      [class.pl-12]="leftIcon()"
      [class.pr-4]="!leftIcon()"
      [class.pl-4]="!leftIcon()"
    />
    <ng-content select="[right-slot]" />
  </div>
  @if (error()) {
    <p class="font-label text-label-sm text-error mt-1">{{ error() }}</p>
  }
</div>
