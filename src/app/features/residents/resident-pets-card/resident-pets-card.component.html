<section
  class="bg-surface-container-lowest rounded-xl p-6 shadow-level-1 border border-outline-variant/30"
>
  <h4
    class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-4"
  >
    Binatang Peliharaan
  </h4>

  @if (pets().length > 0) {
    <div class="space-y-3">
      @for (pet of pets(); track pet.name) {
        <div class="flex items-center gap-4 p-3 rounded-xl border border-outline-variant/20">
          <div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-primary">pets</span>
          </div>
          <div>
            <p class="font-label-md text-label-md text-on-surface">{{ pet.name }}</p>
            <p class="text-on-surface-variant font-label-sm text-label-sm">{{ pet.type }}</p>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="flex items-center gap-4 p-4">
      <div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center shrink-0">
        <span class="material-symbols-outlined text-on-surface-variant">pets</span>
      </div>
      <p class="text-on-surface-variant font-label-md text-label-md">Tidak ada binatang peliharaan terdaftar.</p>
    </div>
  }
</section>
